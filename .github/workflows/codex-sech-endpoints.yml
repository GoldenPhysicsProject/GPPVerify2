name: Codex sech convolution endpoints

on:
  push:
    branches: ["codex/lean-workbench"]
  pull_request:
    branches: ["main", "codex/lean-workbench"]

concurrency:
  group: codex-sech-endpoints-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache lake packages
        uses: actions/cache@v4
        with:
          path: .lake/packages
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json') }}
      - name: Get Mathlib cache
        run: lake exe cache get
      - name: Sech convolution endpoint limits
        run: lake build GppVerify.CelestialHolography.SechConvolutionEndpoints
      - name: Exact nonzero sech convolution closed form
        run: lake build GppVerify.CelestialHolography.SechConvolutionClosedForm
      - name: Wiener-Hopf normalization of sech convolution
        run: lake build GppVerify.CelestialHolography.SechConvolutionWienerHopf
