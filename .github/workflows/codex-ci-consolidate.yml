name: One-shot Codex CI consolidation

on:
  push:
    branches: ["codex/lean-workbench"]
    paths:
      - 'scripts/consolidate_codex_ci.py'
      - '.github/workflows/codex-ci-consolidate.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lean-workbench
          fetch-depth: 0
      - name: Consolidate workbench CI
        run: python scripts/consolidate_codex_ci.py
      - name: Persist CI consolidation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GPP Codex'
          git config user.email 'dtoupin@goldenphysics.org'
          git add -A .github/workflows scripts
          if git diff --cached --quiet; then
            echo 'No CI changes required.'
            exit 0
          fi
          git commit -m 'Consolidate Codex Lean CI and stop workflow fan-out'
          git push origin HEAD:codex/lean-workbench
