name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: lake build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Source sorry gate
        run: python3 scripts/check_sorries.py

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ hashFiles('lean-toolchain') }}

      - name: Cache lake packages
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lakefile.toml', 'lean-toolchain') }}-${{ runner.os }}
          restore-keys: |
            lake-${{ hashFiles('lakefile.toml', 'lean-toolchain') }}-

      - name: Get Mathlib cache
        run: lake exe cache get || true

      - name: Full build
        run: set -o pipefail && lake build 2>&1 | tee /tmp/build.log

      - name: Build-log sorry gate
        run: |
          if grep -F "declaration uses 'sorry'" /tmp/build.log; then
            echo "::error::A declaration uses 'sorry'."
            exit 1
          fi

      - name: Axiom audit
        run: |
          lake env lean scripts/check_axioms.lean | tee /tmp/axioms.log
          if grep -F "sorryAx" /tmp/axioms.log; then
            echo "::error::A flagship theorem depends on sorryAx."
            exit 1
          fi

      - name: Stub census
        run: |
          TOTAL=$(grep -rn ": True := trivial" GppVerify/ --include="*.lean" | wc -l)
          echo "Open-result stubs: $TOTAL"
          grep -rc ": True := trivial" GppVerify/ --include="*.lean" | grep -v ':0$' | sort -t: -k2 -rn || true
