name: Build

on:
  push:
    branches: ["main", "codex/lean-workbench"]
  pull_request:
    branches: ["main", "codex/lean-workbench"]

jobs:
  build:
    name: lake build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL \
            https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ hashFiles('lean-toolchain') }}

      - name: Cache lake packages
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lakefile.toml', 'lean-toolchain') }}-${{ runner.os }}
          restore-keys: |
            lake-${{ hashFiles('lakefile.toml', 'lean-toolchain') }}-

      - name: Get Mathlib cache
        run: lake exe cache get || true

      - name: Codex prime Hankel theorem check
        run: lake env lean GppVerify/RiemannHypothesis/PrimeHankelGram.lean

      - name: Codex prime Hankel root-escape check
        run: lake env lean GppVerify/RiemannHypothesis/PrimeHankelRootEscape.lean

      - name: Build strict-Gram dependency
        run: lake build GppVerify.RiemannHypothesis.PrimeHankelRootEscape

      - name: Codex strict finite Hankel Gram check
        run: lake env lean GppVerify/RiemannHypothesis/PrimeHankelFiniteGramStrict.lean

      - name: Build infinite-lift dependency
        run: lake build GppVerify.RiemannHypothesis.PrimeHankelFiniteGramStrict

      - name: Codex infinite Hankel lift check
        run: lake env lean GppVerify/RiemannHypothesis/PrimeHankelInfiniteLift.lean

      - name: Codex Fisher Hankel specialization check
        run: lake build GppVerify.RiemannHypothesis.PrimeHankelFisherSpecialization

      - name: Codex von Mangoldt all-log summability check
        run: lake build GppVerify.RiemannHypothesis.VonMangoldtCumulantSummability

      - name: Codex Fisher log-moment summability check
        run: lake build GppVerify.RiemannHypothesis.PrimeFisherMomentSummability

      - name: Codex massive-vector 5D Ward reconstruction check
        run: lake build GppVerify.CelestialHolography.MassiveVectorWardReconstruction

      - name: Codex scalar-box regulator endpoint check
        run: set -o pipefail && lake build GppVerify.CelestialHolography.ScalarBoxRegulatorBounds 2>&1 | tee /tmp/scalar-box.log

      - name: Codex scalar-box Spence derivative kernel check
        run: lake build GppVerify.CelestialHolography.RegulatedBoxSpenceDerivativeKernel

      - name: Codex Gamma Wiener-Hopf real-axis check
        run: lake build GppVerify.QuantumGravity.GammaWienerHopfFactor

      - name: Build radial-bridge dependency
        run: lake build GppVerify.RiemannHypothesis.EulerFactorLogDeriv

      - name: Codex prime Poisson radial bridge check
        run: lake env lean GppVerify/RiemannHypothesis/PrimePoissonRadialBridge.lean

      - name: Build prime Poisson radial bridge
        run: lake build GppVerify.RiemannHypothesis.PrimePoissonRadialBridge

      - name: Codex radial positive-type check
        run: lake env lean GppVerify/RiemannHypothesis/PrimePoissonRadialPositiveType.lean

      - name: Build radial positive-type theorem
        run: lake build GppVerify.RiemannHypothesis.PrimePoissonRadialPositiveType

      - name: Build finite-prime bridge
        run: lake build GppVerify.RiemannHypothesis.FinitePrimePoissonSum

      - name: Codex finite-prime positive-type check
        run: lake env lean GppVerify/RiemannHypothesis/FinitePrimePoissonPositiveType.lean

      - name: Upload scalar-box diagnostic
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: scalar-box-diagnostic
          path: /tmp/scalar-box.log
          if-no-files-found: ignore

      - name: Build
        run: set -o pipefail && lake build 2>&1 | tee /tmp/build.log

      - name: Sorry gate (FAILS the build)
        run: |
          echo "=== Sorry gate ==="
          if grep -F "declaration uses 'sorry'" /tmp/build.log /tmp/scalar-box.log; then
            echo "::error::A declaration uses 'sorry'. Standing rule: no sorry ever committed."
            exit 1
          fi
          echo "OK — no declaration uses 'sorry'."

      - name: Axiom audit
        run: |
          echo "=== Axiom audit ==="
          lake env lean scripts/check_axioms.lean | tee /tmp/axioms.log
          if grep -F "sorryAx" /tmp/axioms.log; then
            echo "::error::A flagship theorem depends on sorryAx."
            exit 1
          fi

      - name: Stub census (informational — does NOT fail)
        run: |
          echo "=== Open-result stubs: theorem _ : True := trivial ==="
          TOTAL=$(grep -rn ": True := trivial" GppVerify/ --include="*.lean" | wc -l)
          echo "Total stubs: $TOTAL"
          echo "--- per file ---"
          grep -rc ": True := trivial" GppVerify/ --include="*.lean" \
            | grep -v ':0$' | sort -t: -k2 -rn
          echo
          echo "NOTE: a file can report 0 sorries and 0 axioms and still be mostly stubs."
          echo "Quote all three numbers (sorry / axiom / stub) in any status claim."
